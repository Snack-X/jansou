name: Release native

# Builds and publishes jansou-native wheels. The abi3-py310 build means one
# wheel per platform covers every CPython from 3.10 on. Tag `native-vX.Y.Z`
# publishes; a manual dispatch builds and tests without publishing.

on:
  push:
    tags: ["native-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check the tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check that the tag matches the crate version
        run: |
          pyproject="$(sed -n 's/^version = "\(.*\)"$/\1/p' native/pyproject.toml | head -1)"
          cargo="$(sed -n 's/^version = "\(.*\)"$/\1/p' native/Cargo.toml | head -1)"
          test "$cargo" = "$pyproject"
          test "native-v$pyproject" = "$GITHUB_REF_NAME"

  wheels:
    name: wheel (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-13, target: x86_64-apple-darwin }
          - { runner: macos-latest, target: aarch64-apple-darwin }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: native
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist
          manylinux: auto

      - name: Test the wheel against the differential suite
        run: |
          python -m pip install pytest .
          python -m pip install --no-index --find-links native/dist jansou-native
          python -m pytest tests/test_native_shanten.py tests/test_native_outlook.py

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.platform.target }}
          path: native/dist

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: native
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: native/dist

  publish:
    name: publish to PyPI
    if: github.event_name == 'push'
    needs: [check, wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
