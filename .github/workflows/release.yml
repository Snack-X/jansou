name: Release

# Builds and publishes the pure jansou package. Tag `vX.Y.Z` publishes; a
# manual dispatch builds and tests without publishing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Check that the tag matches the project version
        if: github.event_name == 'push'
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"

      - name: Build sdist and wheel
        run: uv build

      - name: Test the wheel without the native module
        run: >
          uv run --isolated --no-project
          --with dist/jansou-*-py3-none-any.whl --with pytest
          pytest tests/
          --ignore tests/test_native_shanten.py
          --ignore tests/test_native_outlook.py

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist

  publish:
    name: publish to PyPI
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
